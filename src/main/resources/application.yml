server:
  port: 8180
spring:
  main:
    banner-mode: off
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 2s
logging:
  level:
    root: warn
cmms:
  report:
    top: 3
    file: report.xml
  sla:
    critical: 4h
    high: 16h
    normal: 36h
    low: 264h
  import:
    machines-file: data/new_machines.csv
  vendor:
    base-url: http://localhost:8090